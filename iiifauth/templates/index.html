{% extends "layout.html" %}
{% block body %}
  <h3>Images</h3>
  <p>A different-domain client for these images is at<br/>
      <a href="https://tomcrane.github.io/iiif-auth-client/">tomcrane.github.io/iiif-auth-client/</a></p>
  {% for image in images %}
      <h4>{{ image }}</h4>
      <p><a href="{{ url_for('image_info', identifier=image) }}">service for image</a></p>
      <p>
      <img src="{{  url_for('image', identifier=image) }}" style="max-width: 100%" />
      </p>
  {% endfor %}
  <hr/>
  <p><a href="{{ url_for('view_session_tokens') }}">View session tokens</a></p>
{% endblock %}
